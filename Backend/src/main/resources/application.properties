spring.application.name=aula08

spring.datasource.url=jdbc:postgresql://nortedata.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Serviço de ETL em Python (analytics-python). A chave precisa ser igual ao
# ETL_API_KEY do analytics-python/.env; vazia dos dois lados = sem autenticação,
# o que basta para rodar na máquina local.
app.etl.url=${ETL_URL:http://localhost:8000/etl}
app.etl.key=${ETL_KEY:}
