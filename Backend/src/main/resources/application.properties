spring.application.name=aula08

spring.datasource.url=jdbc:postgresql://nortedata.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
