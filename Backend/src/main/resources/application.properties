spring.application.name=aula08

# A plataforma de deploy injeta a porta por PORT (no Render o Tomcat sobe na
# 10000); sem isso o deploy é marcado como "no open ports".
server.port=${PORT:8080}

# DB_USER é o nome usado no roteiro de deploy; DB_USERNAME fica como fallback
# para não quebrar quem já tem o shell local configurado com o nome antigo.
spring.datasource.url=${DB_URL:jdbc:postgresql://nortedata.postgres.database.azure.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:${DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Aceita Base64 ou texto puro (ver JwtService.bytesDoSegredo).
app.jwt.secret=${JWT_SECRET:${JWT_SECRET_BASE64}}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Origens liberadas no CORS: em produção, a URL da Vercel. Lista por vírgula.
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Primeiro ADMIN de um banco vazio (ver config/AdminInicial). Sem as duas
# variáveis o seed não roda — é o que acontece na máquina local.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Serviço de ETL em Python (analytics-python). A chave precisa ser igual ao
# ETL_API_KEY do analytics-python/.env; vazia dos dois lados = sem autenticação,
# o que basta para rodar na máquina local.
app.etl.url=${ETL_URL:http://localhost:8000/etl}
app.etl.key=${ETL_KEY:}
